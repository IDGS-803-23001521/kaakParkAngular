<button class="sidebar-toggle-mobile" (click)="toggleMobile()" aria-label="Abrir menú">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
    stroke-linecap="round" stroke-linejoin="round">
    <line x1="3" y1="6" x2="21" y2="6" />
    <line x1="3" y1="12" x2="21" y2="12" />
    <line x1="3" y1="18" x2="21" y2="18" />
  </svg>
</button>

<div class="sidebar-overlay" *ngIf="mobileOpen" (click)="closeMobile()"></div>

<nav class="sidebar-kaak" [class.open]="mobileOpen">
  <div class="sidebar-logo">
    <img src="assets/images/Logo.png" alt="K'áaxPark" />

  </div>

  <div class="sidebar-nav">
    <span class="sidebar-section-label">Operación</span>
    <a routerLink="/dashboard" class="sidebar-link" title="Dashboard" [class.active]="isActive('/dashboard')" (click)="closeMobile()">
      <animated-icons
        src="assets/icons/analytics-minimalistic-8467715e.json"
        trigger="loop"
        attributes='{"variationThumbColour":"#000000","variationName":"Dark","variationNumber":4,"numberOfGroups":2,"strokeWidth":1.5,"backgroundIsGroup":true,"defaultColours":{"group-1":"#FFFFFFFF","group-2":"#000000","background":"#1B1B1BFF"}}'
        height="35" width="35"></animated-icons>
      <span>Dashboard</span>
    </a>
    <a routerLink="/cajones" class="sidebar-link" title="Cajones" [class.active]="isActive('/cajones')" (click)="closeMobile()">
